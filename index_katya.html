  --today:#d6d0bd; --today-soft:#3a372c; --open:#b9adf5; --open-soft:#322c4f; --ok:#7fd49c; --ok-soft:#1f3a27;
  --me:#7fd49c; --me-soft:#1f3a27; --her:#f39ac3; --her-soft:#4a2337; --other:#8cc0f5; --other-soft:#1e3249; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1910; --side:#232014; --surface:#2a2618; --fg:#f4eed6; --muted:#b5aa83; --line:#3d3820;
  --acc:#f5d860; --acc-soft:#4a4118; --btn:#d9b53a; --btn-fg:#1b1600;
  --late:#ff8a7d; --late-soft:#4a2420; --late-mid:#8a3b33;
  --today:#d6d0bd; --today-soft:#3a372c; --open:#b9adf5; --open-soft:#322c4f; --ok:#7fd49c; --ok-soft:#1f3a27;
  --me:#7fd49c; --me-soft:#1f3a27; --her:#f39ac3; --her-soft:#4a2337; --other:#8cc0f5; --other-soft:#1e3249; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}

.brand{font-weight:700;font-size:16px;padding:0 8px 4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}

.crumb{color:var(--muted);font-size:13px;margin-bottom:6px;display:flex;gap:10px}

.link{background:none;border:0;color:var(--acc);cursor:pointer;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--late)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}

.group{margin:22px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group.late{color:var(--late)}.group.today{color:var(--today)}.group.done{color:var(--ok)}
ul.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.late{box-shadow:inset 3px 0 0 var(--late)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin-top:1px;border:2px solid var(--muted);border-radius:6px;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.task input[type=checkbox]::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.task input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
.task input[type=checkbox]:checked::after{opacity:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tbody{flex:1;min-width:0;cursor:pointer}
.tt{overflow-wrap:anywhere}
.tn{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;white-space:pre-line}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:10px;border:0;white-space:nowrap;cursor:pointer;background:var(--today-soft);color:var(--muted)}
.chip.me{background:var(--me-soft);color:var(--me)}

.chip.ghost{background:transparent;border:1px solid var(--line)}
.due{position:relative;font-family:var(--mono);font-size:12px;flex:none;padding:2px 8px;border-radius:8px;background:var(--today-soft);color:var(--muted);white-space:nowrap;cursor:pointer}
.due input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.due.late{background:var(--late-soft);color:var(--late);font-weight:700}
.due.today{background:var(--acc-soft);color:var(--acc);font-weight:700}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task.done .due{opacity:.5}
.icon{flex:none;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;line-height:1}
.icon:hover{color:var(--acc)}
.edit{display:grid;gap:8px;padding:14px;border-top:1px solid var(--line);background:var(--acc-soft)}
.edit:first-child{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.f{font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:100%}
textarea.f{min-height:70px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btns .link{margin-left:auto}
form.add{display:grid;gap:8px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.note .hd{display:flex;gap:10px;align-items:baseline}
.note h3{margin:0 0 8px;font-size:15px}
.note .hd .link{margin-left:auto}
.note ul{margin:0;padding-left:20px}.note li{margin:4px 0}.note p{margin:0 0 6px}
.graph{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden;position:relative}
.graph.editing{border-color:var(--btn);box-shadow:0 0 0 3px var(--acc-soft)}
.gbar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.gbar button{font-size:13px;padding:5px 12px}
.ghint{position:absolute;left:12px;top:14px;right:290px;line-height:1.3;font-size:12px;color:var(--muted);z-index:1}
.graph svg{display:block;width:100%;height:auto;touch-action:none}
.graph .lbl{font-family:var(--body);font-size:13px;fill:var(--fg);pointer-events:none}
.graph .cnt{font-family:var(--mono);font-size:11px;fill:var(--fg);pointer-events:none}
.graph g.node{cursor:pointer}
.graph.editing g.node{cursor:grab}
.graph g.node:hover circle{stroke-width:2.5}
.graph g.sel circle{stroke:var(--acc);stroke-width:3.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 18px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.login{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%);display:grid;gap:10px}
.login h1{font-size:22px}
.err{color:var(--late);font-size:13px;min-height:1em}
.menu{display:none}
@media (max-width:760px){
  #app{grid-template-columns:1fr;background:var(--bg)}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  aside.closed .navwrap{display:none}
  .menu{display:inline-block;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 8px 0;cursor:pointer}
  .task{flex-wrap:wrap}.tbody{flex:1 1 calc(100% - 64px)}.due{order:5;margin-left:32px}.icon{order:6}
  .ghint{position:static;padding:10px 12px 0}
}

<body>
<div id="root"><div class="center">Загружаю…</div></div>
<script>
(function(){
var C=window.PLANNER, DEMO=/[?&]demo\b/.test(location.search);
var sb=null, S={branches:[],tasks:[],notes:[]}, view="overview", status="", editing=null, editNote=null;
var G={edit:false,draft:null,sel:null};
var ROLES={me:"София",her:"Катя",other:"Ваня"};
try{view=localStorage.getItem("katya-view")||view}catch(e){}

function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var TODAY=iso(new Date());
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"],WD=["вс","пн","вт","ср","чт","пт","сб"];
function fmt(d){var x=new Date(d+"T12:00:00");return WD[x.getDay()]+", "+x.getDate()+" "+MON[x.getMonth()]}
function st(t){return t.done?"done":t.due<TODAY?"late":t.due===TODAY?"today":"later"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sortT(a,b){if(a.done!==b.done)return a.done?1:-1;if(a.due!==b.due)return a.due<b.due?-1:1;return (a.created_at||"")<(b.created_at||"")?-1:1}
function br(id){for(var i=0;i<S.branches.length;i++)if(S.branches[i].id===id)return S.branches[i];return{id:id,name:"Без сферы"}}
function open(a){return a.filter(function(t){return!t.done})}
function who(k){return k==="her"?ROLES.her+" · напомнить":k==="other"?ROLES.other+" · проследить":ROLES.me}
function root(h){document.getElementById("root").innerHTML=h}
function val(id){var e=document.getElementById(id);return e?e.value:""}
function task(id){for(var i=0;i<S.tasks.length;i++)if(String(S.tasks[i].id)===String(id))return S.tasks[i]}
function notes(){return S.notes.filter(function(n){return n.id!=="settings"&&n.id!=="graph"})}

/* ---------- данные ---------- */
function applySettings(){
  S.notes.forEach(function(n){if(n.id==="settings"){try{var o=JSON.parse(n.body);for(var k in ROLES)if(o[k])ROLES[k]=o[k]}catch(e){}}});
}
function demoData(){
  function d(n){var x=new Date();x.setDate(x.getDate()+n);return iso(x)}
  S.branches=[{id:"rest",name:"Отдых, красота, развитие",sort:1},{id:"move",name:"Переезд, США, налоги",sort:2},{id:"media",name:"Бизнес и медиа",sort:3},{id:"vanya",name:"Ваня",sort:4},{id:"ops",name:"Организационное",sort:5}];
  S.notes=[{id:"focus",title:"Фокус",body:"- Пример заметки",sort:1}];
  S.tasks=[{id:"1",branch_id:"rest",title:"Пример: массаж",note:"Демо",who:"me",due:d(-1),done:false},{id:"2",branch_id:"media",title:"Пример: кейсы блогеров",who:"her",due:d(0),done:false},{id:"3",branch_id:"vanya",title:"Пример: доступ к аккаунту",who:"other",due:d(3),done:false}];
}
function load(){
  if(DEMO){demoData();return Promise.resolve()}
  return Promise.all([
    sb.from("branches").select("*").order("sort"),
    sb.from("tasks").select("*"),
    sb.from("notes").select("*").order("sort")
  ]).then(function(r){
    for(var i=0;i<3;i++)if(r[i].error)throw r[i].error;
    S.branches=r[0].data;S.tasks=r[1].data;S.notes=r[2].data;applySettings();
  });
}
function q(p,after){
  if(DEMO){if(after)after({data:null});render();return Promise.resolve()}
  setStatus("Сохраняю…");
  return p.then(function(r){if(r.error)throw r.error;setStatus("Сохранено");if(after)after(r)})
   .catch(function(e){setStatus("Не сохранилось: "+(e.message||e));load().then(render)});
}
function setStatus(s){status=s;var el=document.getElementById("save");if(el)el.textContent=s}

/* ---------- вид ---------- */
function branchOpts(sel){return S.branches.map(function(b){return'<option value="'+esc(b.id)+'"'+(b.id===sel?" selected":"")+'>'+esc(b.name)+'</option>'}).join("")}
function whoOpts(sel){return ["me","her","other"].map(function(k){return'<option value="'+k+'"'+(k===sel?" selected":"")+'>'+esc(who(k))+'</option>'}).join("")}
function editHTML(t){
  return '<li class="edit" data-id="'+t.id+'">'+
   '<input class="f" id="et" value="'+esc(t.title)+'" aria-label="Задача">'+
   '<textarea class="f" id="en" placeholder="Заметка" aria-label="Заметка">'+esc(t.note||"")+'</textarea>'+
   '<div class="row"><select class="f" id="eb" aria-label="Сфера">'+branchOpts(t.branch_id)+'</select>'+
   '<select class="f" id="ew" aria-label="Кто">'+whoOpts(t.who)+'</select>'+
   '<input class="f" type="date" id="ed" value="'+t.due+'" aria-label="Срок"></div>'+
   '<div class="btns"><button class="pri" data-act="esave">Сохранить</button><button class="sec" data-act="ecancel">Отмена</button><button class="link danger" data-act="del">Удалить задачу</button></div></li>';
}
function taskHTML(t,showBr){
  if(editing===String(t.id))return editHTML(t);
  var s=st(t),b=br(t.branch_id);
  return '<li class="task'+(t.done?" done":"")+(s==="late"?" late":"")+'" data-id="'+t.id+'"><input type="checkbox" aria-label="Готово" '+(t.done?"checked ":"")+'data-act="tog">'+
   '<div class="tbody" data-act="edit" title="Нажми, чтобы изменить"><span class="tt">'+esc(t.title)+'</span>'+(t.note?'<span class="tn">'+esc(t.note)+'</span>':"")+
   '<div class="meta"><button class="chip '+t.who+'" data-act="go" data-v="who:'+t.who+'">'+esc(who(t.who))+'</button>'+
   (showBr?'<button class="chip ghost" data-act="go" data-v="b:'+esc(b.id)+'">'+esc(b.name)+'</button>':"")+'</div></div>'+
   '<label class="due '+s+'" title="Перенести срок">'+(s==="late"?"просрочено · ":s==="today"?"сегодня · ":"")+fmt(t.due)+
   '<input type="date" value="'+t.due+'" data-act="due" aria-label="Срок"></label>'+
   '<button class="icon" data-act="edit" aria-label="Изменить">изменить</button></li>';
}
function grouped(arr,showBr){
  arr=arr.slice().sort(sortT);var h="";
  [["late","Просрочено"],["today","Сегодня"],["later","Дальше"],["done","Сделано"]].forEach(function(g){
    var xs=arr.filter(function(t){return st(t)===g[0]});if(!xs.length)return;
    h+='<div class="group '+g[0]+'">'+g[1]+' · '+xs.length+'</div><ul class="tasks">'+xs.map(function(t){return taskHTML(t,showBr)}).join("")+'</ul>';
  });
  return h||'<p class="lead">Здесь пока нет задач.</p>';
}
function addForm(def,whoDef){
  if(!S.branches.length)return "";
  return '<form class="add" id="addf"><input class="f" type="text" id="nt" placeholder="Новая задача" aria-label="Новая задача" required>'+
   '<div class="row"><select class="f" id="nb" aria-label="Сфера">'+branchOpts(def)+'</select><select class="f" id="nw" aria-label="Кто">'+whoOpts(whoDef)+'</select>'+
   '<input class="f" type="date" id="nd" aria-label="Срок" required value="'+TODAY+'"></div>'+
   '<textarea class="f" id="nn" placeholder="Заметка (необязательно)" aria-label="Заметка" style="min-height:40px"></textarea><div class="btns"><button class="pri" type="submit">Добавить задачу</button></div></form>';
}
function md(s){
  var out="",list=false;
  String(s||"").split("\n").forEach(function(l){
    if(/^\s*[-*]\s+/.test(l)){if(!list){out+="<ul>";list=true}out+="<li>"+esc(l.replace(/^\s*[-*]\s+/,""))+"</li>";}
    else{if(list){out+="</ul>";list=false}if(l.trim())out+="<p>"+esc(l)+"</p>";}
  });
  return out+(list?"</ul>":"");
}
var GW=760,GH=420;
function gNodes(){return [{id:"focus",name:ROLES.her,center:true}].concat(S.branches.map(function(b){return{id:b.id,name:b.name}}))}
function gDefault(){
  var bs=S.branches,pos={focus:[GW/2,GH/2]},links=[];
  bs.forEach(function(b,i){var a=-Math.PI/2+i*2*Math.PI/bs.length;pos[b.id]=[GW/2+Math.cos(a)*250,GH/2+Math.sin(a)*140];links.push(["focus",b.id])});
  return{pos:pos,links:links};
}
function gSaved(){
  var d=gDefault(),n=S.notes.filter(function(x){return x.id==="graph"})[0];
  if(n){try{var o=JSON.parse(n.body);if(o.pos)for(var k in o.pos)if(d.pos[k])d.pos[k]=o.pos[k];if(o.links)d.links=o.links.filter(function(l){return d.pos[l[0]]&&d.pos[l[1]]})}catch(e){}}
  return d;
}
function gData(){return G.edit&&G.draft?G.draft:gSaved()}
function graphSVG(){
  var g=gData(),h="";
  g.links.forEach(function(l){var a=g.pos[l[0]],b=g.pos[l[1]];h+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="var(--line)" stroke-width="2"/>'});
  gNodes().forEach(function(n){
    var p=g.pos[n.id];if(!p)return;var x=p[0].toFixed(1),y=p[1].toFixed(1),sel=G.sel===n.id?" sel":"";
    if(n.center){h+='<g class="node'+sel+'" data-node="focus" tabindex="0" role="button" aria-label="Фокус"><circle cx="'+x+'" cy="'+y+'" r="40" fill="var(--btn)" stroke="var(--acc)" stroke-width="1.5"/><text class="lbl" x="'+x+'" y="'+(p[1]+5).toFixed(1)+'" text-anchor="middle" style="font-weight:600">'+esc(n.name)+'</text></g>';return}
    var ts=open(S.tasks.filter(function(t){return t.branch_id===n.id})),l=ts.some(function(t){return st(t)==="late"}),r=17+Math.min(ts.length,16)*1.2;
    var name=n.name.length>26?n.name.slice(0,24)+"…":n.name;
    h+='<g class="node'+sel+'" data-node="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.name)+'"><circle cx="'+x+'" cy="'+y+'" r="'+r.toFixed(1)+'" fill="'+(l?"var(--late-soft)":"var(--acc-soft)")+'" stroke="'+(l?"var(--late)":"var(--acc)")+'" stroke-width="'+(l?2:1.2)+'"/>'+
     '<text class="cnt" x="'+x+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle"'+(l?' style="fill:var(--late);font-weight:700"':'')+'>'+ts.length+'</text>'+
     '<text class="lbl" x="'+x+'" y="'+(p[1]+r+17).toFixed(1)+'" text-anchor="middle">'+esc(name)+'</text></g>';
  });
  return '<svg id="gsvg" viewBox="0 0 '+GW+' '+GH+'" role="img" aria-label="Карта сфер">'+h+'</svg>';
}
function graph(){
  if(!S.branches.length)return "";
  var bar=G.edit?'<div class="gbar"><button class="sec" data-act="greset">Сбросить</button><button class="sec" data-act="gcancel">Отмена</button><button class="pri" data-act="gsave">Готово</button></div><div class="ghint">Тяни кружки мышкой. Нажми на один кружок, потом на другой — связь появится или пропадёт.</div>'
    :'<div class="gbar"><button class="sec" data-act="gedit">Изменить</button></div>';
  return '<div class="graph'+(G.edit?" editing":"")+'" id="graph">'+bar+graphSVG()+'</div>';
}
function gPoint(svg,e){var r=svg.getBoundingClientRect();return[Math.max(30,Math.min(GW-30,(e.clientX-r.left)/r.width*GW)),Math.max(30,Math.min(GH-30,(e.clientY-r.top)/r.height*GH))]}
function gRedraw(){var w=document.getElementById("graph");if(!w)return;var old=document.getElementById("gsvg");var t=document.createElement("div");t.innerHTML=graphSVG();w.replaceChild(t.firstChild,old)}
var drag=null;
document.addEventListener("pointerdown",function(e){
  var n=e.target.closest&&e.target.closest("g.node");if(!n)return;var svg=document.getElementById("gsvg");
  var id=n.getAttribute("data-node");
  if(!G.edit){return}
  e.preventDefault();drag={id:id,x:e.clientX,y:e.clientY,moved:false};
  try{svg.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener("pointermove",function(e){
  if(!drag)return;var svg=document.getElementById("gsvg");if(!svg)return;
  if(!drag.moved&&Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<5)return;
  drag.moved=true;G.draft.pos[drag.id]=gPoint(svg,e);gRedraw();
});
document.addEventListener("pointerup",function(e){
  if(!drag)return;var d=drag;drag=null;if(d.moved)return;
  if(!G.sel){G.sel=d.id}
  else if(G.sel===d.id){G.sel=null}
  else{var a=G.sel,b=d.id,L=G.draft.links,i=L.findIndex(function(l){return(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a)});
    if(i>=0)L.splice(i,1);else L.push([a,b]);G.sel=null}
  gRedraw();
});
document.addEventListener("click",function(e){
  var n=e.target.closest&&e.target.closest("g.node");if(!n||G.edit)return;
  var id=n.getAttribute("data-node");view=id==="focus"?"focus":"b:"+id;try{localStorage.setItem("katya-view",view)}catch(x){}render();window.scrollTo(0,0);
});
function nav(v,label,n,late,dot){
  return '<button class="nav'+(view===v?" on":"")+'" data-act="go" data-v="'+esc(v)+'">'+(dot?'<span class="dot" style="background:var(--'+dot+')"></span>':'')+esc(label)+(n!=null?'<span class="n'+(late?" late":"")+'">'+n+'</span>':"")+'</button>';
}
function noteHTML(n){
  if(editNote===n.id)return '<div class="note" data-nid="'+esc(n.id)+'"><input class="f" id="ntt" value="'+esc(n.title)+'" aria-label="Заголовок" style="margin-bottom:8px">'+
    '<textarea class="f" id="ntb" style="min-height:200px" aria-label="Текст заметки">'+esc(n.body)+'</textarea>'+
    '<p class="lead" style="margin:6px 0 10px;font-size:12px">Строка с «- » в начале станет пунктом списка.</p>'+
    '<div class="btns"><button class="pri" data-act="nsave">Сохранить</button><button class="sec" data-act="ncancel">Отмена</button><button class="link danger" data-act="ndel">Удалить заметку</button></div></div>';
  return '<div class="note" data-nid="'+esc(n.id)+'"><div class="hd"><h3>'+esc(n.title)+'</h3><button class="link" data-act="nedit">изменить</button></div>'+(md(n.body)||'<p class="lead" style="margin:0">Пусто.</p>')+'</div>';
}
function settingsHTML(){
  return '<div class="note"><h3>Роли</h3><p class="lead" style="margin:0 0 10px">Как подписаны люди в задачах.</p>'+
   '<div class="row"><label>Делаю я<input class="f" id="r_me" value="'+esc(ROLES.me)+'"></label><label>Напоминаю ей<input class="f" id="r_her" value="'+esc(ROLES.her)+'"></label><label>Слежу за<input class="f" id="r_other" value="'+esc(ROLES.other)+'"></label></div>'+
   '<div class="btns" style="margin-top:10px"><button class="pri" data-act="rsave">Сохранить роли</button></div></div>'+
   '<div class="note"><h3>Сферы</h3><p class="lead" style="margin:0 0 10px">Переименовать — поменяй название и сохрани. Удалить можно только пустую сферу.</p>'+
   S.branches.map(function(b){var n=S.tasks.filter(function(t){return t.branch_id===b.id}).length;
     return '<div class="row" style="margin-bottom:8px;align-items:center" data-bid="'+esc(b.id)+'"><input class="f" value="'+esc(b.name)+'" aria-label="Название сферы" style="flex:3 1 220px"><button class="sec" data-act="bsave" style="flex:0 0 auto">Сохранить</button>'+(n?'<span class="lead" style="margin:0;flex:0 0 auto;font-size:12px">'+n+' задач</span>':'<button class="link danger" data-act="bdel" style="flex:0 0 auto">удалить</button>')+'</div>'}).join("")+
   '<div class="row" style="margin-top:12px"><input class="f" id="nbn" placeholder="Новая сфера" style="flex:3 1 220px"><button class="pri" data-act="badd" style="flex:0 0 auto">Добавить сферу</button></div></div>';
}
function render(){
  var all=S.tasks,op=open(all),late=op.filter(function(t){return st(t)==="late"}),tod=op.filter(function(t){return st(t)==="today"});
  var side='<div class="brand">'+esc(C.title)+'<small>'+esc(ROLES.her)+' · '+esc(ROLES.me)+(DEMO?" · демо":"")+'</small></div><button class="menu" data-act="menu">Меню</button><div class="navwrap">'+
    nav("overview","Обзор")+nav("now","Сегодня и просрочено",late.length+tod.length,late.length>0)+
    nav("who:me","Делаю: "+ROLES.me,op.filter(function(t){return t.who==="me"}).length,false,"me")+
    nav("who:her","Напомнить: "+ROLES.her,op.filter(function(t){return t.who==="her"}).length,false,"her")+
    nav("who:other","Проследить: "+ROLES.other,op.filter(function(t){return t.who==="other"}).length,false,"other")+
    nav("all","Все по срокам",op.length)+
    '<div class="navh">Сферы</div>'+nav("focus","Фокус и заметки")+
    S.branches.map(function(b){var ts=open(all.filter(function(t){return t.branch_id===b.id}));return nav("b:"+b.id,b.name,ts.length,ts.some(function(t){return st(t)==="late"}))}).join("")+
    nav("settings","Сферы и роли")+
    (DEMO?"":'<button class="out" data-act="out">Выйти</button>')+'</div>';
  var title,lead="",main="",crumb=C.title,extra="";
  if(view==="now"){title="Сегодня и просрочено";lead="Сначала закрываем просроченное, потом сегодняшнее.";main=grouped(late.concat(tod),true)+addForm(S.branches[0]&&S.branches[0].id,"me")}
  else if(view==="all"){title="Все задачи по срокам";lead="Одна лента: чем раньше срок, тем выше. Нажми на задачу, чтобы изменить.";main=grouped(all,true)+addForm(S.branches[0]&&S.branches[0].id,"me")}
  else if(view.indexOf("who:")===0){var w=view.slice(4);title=w==="her"?"Напомнить: "+ROLES.her:w==="other"?"Проследить: "+ROLES.other:"Делает "+ROLES.me;
    lead=w==="her"?"Это делает она сама. Напоминать, пока не будет сделано.":w==="other"?"Это делают другие. Проверить к сроку и напомнить.":"";
    main=grouped(all.filter(function(t){return t.who===w}),true)+addForm(S.branches[0]&&S.branches[0].id,w)}
  else if(view==="focus"){title="Фокус и заметки";crumb="Сферы / Фокус";lead="Цели, правила работы, всё, что нужно держать в голове.";
    main=notes().map(noteHTML).join("")+'<div class="btns"><button class="sec" data-act="nadd">+ Новая заметка</button></div>'}
  else if(view==="settings"){title="Сферы и роли";crumb="Настройки";main=settingsHTML()}
  else if(view.indexOf("b:")===0){var b=br(view.slice(2));title=b.name;crumb="Сферы / "+b.name;lead="Задачи сферы по сроку. Нажми на задачу, чтобы изменить.";main=grouped(all.filter(function(t){return t.branch_id===b.id}),false)+addForm(b.id,"me")}
  else{view="overview";title="Обзор";lead="Все задачи по сферам, по сроку: что раньше — то и делаем первым.";
    main='<div class="stats"><div class="stat late"><b>'+late.length+'</b><span>просрочено</span></div><div class="stat today"><b>'+tod.length+'</b><span>на сегодня</span></div><div class="stat open"><b>'+op.length+'</b><span>открыто</span></div><div class="stat ok"><b>'+(all.length-op.length)+'</b><span>сделано</span></div></div>'+
    graph()+'<div class="legend"><span><i style="background:var(--me)"></i>'+esc(who("me"))+'</span><span><i style="background:var(--her)"></i>'+esc(who("her"))+'</span><span><i style="background:var(--other)"></i>'+esc(who("other"))+'</span><span><i style="background:var(--late)"></i>есть просрочка</span></div>'+'<div class="group">Ближайшие задачи</div>'+(op.length?'<ul class="tasks">'+op.slice().sort(sortT).slice(0,8).map(function(t){return taskHTML(t,true)}).join("")+'</ul>':'<p class="lead">Задач пока нет.</p>')}
  root('<div id="app"><aside id="side"'+(window.innerWidth<760&&!render.opened?' class="closed"':'')+'>'+side+'</aside><main><div class="crumb"><span>'+esc(crumb)+'</span><span class="save" id="save">'+esc(status)+'</span></div><h1>'+esc(title)+'</h1>'+(lead?'<p class="lead">'+esc(lead)+'</p>':"")+main+extra+'</main></div>');
  var f=document.getElementById("addf");
  if(f)f.addEventListener("submit",function(e){e.preventDefault();
    var t={branch_id:val("nb"),title:val("nt").trim(),who:val("nw"),due:val("nd"),note:val("nn").trim()||null,done:false};
    if(!t.title||!t.due)return;
    if(DEMO){t.id="d"+Date.now();S.tasks.push(t);render();return}
    q(sb.from("tasks").insert(t).select().single(),function(r){S.tasks.push(r.data);render()});
  });
  var et=document.getElementById("et");if(et)et.focus();
}

/* ---------- действия ---------- */
function slug(){return "b"+Date.now().toString(36)}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act");
  if(a==="tog"||a==="due"||(e.target.closest(".due")&&a!=="go"))return;
  var li=el.closest("[data-id]"),id=li&&li.getAttribute("data-id"),t=id&&task(id);
  if(a==="go"){e.stopPropagation();view=el.getAttribute("data-v");editing=null;editNote=null;try{localStorage.setItem("katya-view",view)}catch(x){}render.opened=false;render();window.scrollTo(0,0)}
  else if(a==="menu"){var s=document.getElementById("side");s.classList.toggle("closed");render.opened=!s.classList.contains("closed")}
  else if(a==="edit"){if(e.target.closest(".chip"))return;editing=String(id);render()}
  else if(a==="ecancel"){editing=null;render()}
  else if(a==="esave"&&t){
    var p={title:val("et").trim()||t.title,note:val("en").trim()||null,branch_id:val("eb"),who:val("ew"),due:val("ed")||t.due};
    for(var k in p)t[k]=p[k];editing=null;render();q(sb&&sb.from("tasks").update(p).eq("id",id));
  }
  else if(a==="del"&&t){if(!confirm("Удалить задачу «"+t.title+"»?"))return;S.tasks=S.tasks.filter(function(x){return x!==t});editing=null;render();q(sb&&sb.from("tasks").delete().eq("id",id))}
  else if(a==="out"){sb.auth.signOut().then(start)}
  else if(a==="gedit"){G.edit=true;G.draft=JSON.parse(JSON.stringify(gSaved()));G.sel=null;render()}
  else if(a==="gcancel"){G.edit=false;G.draft=null;G.sel=null;render()}
  else if(a==="greset"){G.draft=gDefault();G.sel=null;gRedraw()}
  else if(a==="gsave"){var body=JSON.stringify(G.draft),ex=S.notes.filter(function(x){return x.id==="graph"})[0];
    if(ex)ex.body=body;else S.notes.push({id:"graph",title:"graph",body:body,sort:998});
    G.edit=false;G.draft=null;G.sel=null;render();q(sb&&sb.from("notes").upsert({id:"graph",title:"graph",body:body,sort:998}))}
  else if(a==="nedit"){editNote=el.closest("[data-nid]").getAttribute("data-nid");render()}
  else if(a==="ncancel"){editNote=null;render()}
  else if(a==="nsave"){var nid=el.closest("[data-nid]").getAttribute("data-nid"),n=S.notes.filter(function(x){return x.id===nid})[0];
    n.title=val("ntt").trim()||"Заметка";n.body=val("ntb");editNote=null;render();q(sb&&sb.from("notes").upsert({id:n.id,title:n.title,body:n.body,sort:n.sort||0}))}
  else if(a==="ndel"){var nid2=el.closest("[data-nid]").getAttribute("data-nid");if(!confirm("Удалить заметку?"))return;S.notes=S.notes.filter(function(x){return x.id!==nid2});editNote=null;render();q(sb&&sb.from("notes").delete().eq("id",nid2))}
  else if(a==="nadd"){var nn={id:"n"+Date.now().toString(36),title:"Новая заметка",body:"",sort:notes().length+1};S.notes.push(nn);editNote=nn.id;render();q(sb&&sb.from("notes").insert(nn))}
  else if(a==="rsave"){ROLES={me:val("r_me").trim()||"Я",her:val("r_her").trim()||"Она",other:val("r_other").trim()||"Другие"};
    var body=JSON.stringify(ROLES),ex=S.notes.filter(function(x){return x.id==="settings"})[0];if(ex)ex.body=body;else S.notes.push({id:"settings",title:"settings",body:body,sort:999});
    render();q(sb&&sb.from("notes").upsert({id:"settings",title:"settings",body:body,sort:999}))}
  else if(a==="bsave"){var row=el.closest("[data-bid]"),bid=row.getAttribute("data-bid"),nm=row.querySelector("input").value.trim();if(!nm)return;br(bid).name=nm;render();q(sb&&sb.from("branches").update({name:nm}).eq("id",bid))}
  else if(a==="bdel"){var bid2=el.closest("[data-bid]").getAttribute("data-bid");if(!confirm("Удалить сферу «"+br(bid2).name+"»?"))return;S.branches=S.branches.filter(function(b){return b.id!==bid2});render();q(sb&&sb.from("branches").delete().eq("id",bid2))}
  else if(a==="badd"){var nm2=val("nbn").trim();if(!nm2)return;var nb={id:slug(),name:nm2,icon:"",sort:S.branches.length+1};S.branches.push(nb);render();q(sb&&sb.from("branches").insert(nb))}
});
document.addEventListener("change",function(e){
  var a=e.target.getAttribute("data-act");if(a!=="tog"&&a!=="due")return;
  var id=e.target.closest("[data-id]").getAttribute("data-id"),t=task(id);if(!t)return;
  var p=a==="tog"?{done:e.target.checked}:{due:e.target.value};if(a==="due"&&!p.due)return;
  for(var k in p)t[k]=p[k];render();q(sb&&sb.from("tasks").update(p).eq("id",id));
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g.node")&&!G.edit){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
  if(e.key==="Escape"&&(editing||editNote)){editing=null;editNote=null;render()}
});

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&sb&&!DEMO&&!editing&&!editNote&&!G.edit){TODAY=iso(new Date());load().then(render).catch(function(){})}});

/* ---------- вход ---------- */
function loginForm(msg){
  root('<div class="center"><form class="login" id="lf"><h1>'+esc(C.title)+'</h1><p class="lead" style="margin:0">Вход</p>'+
   '<input class="f" type="email" id="le" placeholder="Почта" autocomplete="email" required><input class="f" type="password" id="lp" placeholder="Пароль" autocomplete="current-password" required>'+
   '<button class="pri" type="submit">Войти</button><div class="err" id="lerr">'+esc(msg||"")+'</div></form></div>');
  document.getElementById("lf").addEventListener("submit",function(e){e.preventDefault();
    document.getElementById("lerr").textContent="Вхожу…";
    sb.auth.signInWithPassword({email:val("le").trim(),password:val("lp")}).then(function(r){
      if(r.error){document.getElementById("lerr").textContent=r.error.message==="Invalid login credentials"?"Неверная почта или пароль":"Не получилось: "+r.error.message;return}
      boot()});
  });
}
function boot(){root('<div class="center">Загружаю задачи…</div>');load().then(function(){
    if(!DEMO&&!S.branches.length){sb.auth.signOut({scope:"local"}).finally(function(){loginForm("База не отдала данные — войди ещё раз.")});return}
    render()
  }).catch(function(e){root('<div class="center"><div class="login"><b>Не получилось загрузить задачи</b><div class="err">'+esc(e.message||e)+'</div></div></div>')})}
function start(){
  if(DEMO){boot();return}
  sb=sb||window.supabase.createClient(C.supabaseUrl,C.supabaseKey);
  sb.auth.getUser().then(function(r){
    if(r.data&&r.data.user)boot();
    else sb.auth.signOut({scope:"local"}).finally(function(){loginForm()});
  }).catch(function(){loginForm()});
}
start();
})();
</script>
</body>
</html>
